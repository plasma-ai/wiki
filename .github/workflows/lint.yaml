name: lint

on:
  push:
    branches:
      - main
      - dev
      - v2
  pull_request:
    branches:
      - main
      - dev
      - v2
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_BUILD_WARNINGS: deny

jobs:
  lint:
    name: lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' }}
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.1,cargo-shear@1.14.1
      - name: Cache pre-commit hooks
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure --color=always
      - name: Check that project is up-to-date with template
        run: |
          template=$(jq -r .template .cruft.json)
          commit=$(jq -r .commit .cruft.json)
          directory=$(jq -r .directory .cruft.json)
          git clone --quiet --filter=blob:none --no-checkout "$template" "$RUNNER_TEMP/template"
          pinned=$(git -C "$RUNNER_TEMP/template" rev-parse --quiet --verify "$commit:$directory") || true
          latest=$(git -C "$RUNNER_TEMP/template" rev-parse --quiet --verify "HEAD:$directory") || true
          if [[ -z "$pinned" || "$pinned" != "$latest" ]]; then
            echo "::error::the $directory template changed after $commit: run cruft update"
            exit 1
          fi
      - name: Reject forbidden file patterns
        run: test -z "$(find . -name "*.rej" -print -quit)" || exit 1
      - name: Check Rust supply chain
        run: |
          cargo deny --locked check bans licenses sources
          cargo shear --locked
  advisories:
    name: advisories
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain
        run: rustup toolchain install
      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.22.1
      - name: Check Rust advisories
        run: cargo deny --locked check advisories
