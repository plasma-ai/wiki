# The oracle: v1 at the commit every comparison is run against. The rules are
# in SPEC.md, under Oracle. `python -m parity oracle ensure` builds the
# checkout and the venvs this file names, and `python -m parity oracle check`
# holds the file level with v1.

# the oracle commit: the merge base of this branch and `base`
commit = "f6a7ba5d9de90c5d59165eee15600de916e88829"
# what `wiki --version` prints at that commit
version = "1.10.0"
# the branch v1 lives on
base = "dev"

# the oracle side: the interpreter and the packages that define parity
[sides.oracle]
python = "3.14.6"
unicode = "16.0.0"
libyaml = "0.2.5"
constraints = "constraints/oracle.txt"

# the alt side: the oracle commit under a second interpreter that v1 supports,
# with its own packages
[sides.alt]
python = "3.13.12"
unicode = "15.1.0"
libyaml = "0.2.5"
constraints = "constraints/alt.txt"

# the crossed side: the alt side's interpreter under the oracle side's
# packages, so a difference between those two has one cause on each side of it
[sides.crossed]
python = "3.13.12"
unicode = "15.1.0"
libyaml = "0.2.5"
constraints = "constraints/oracle.txt"
