# The kind list: every notice kind and every issue kind of v1, each with its
# one home. A home is a test of v1 whose replayed call shows the kind, or
# "perturbation" for a kind that the perturbation puts into its trees. The
# rules are in SPEC.md, under Replay.

# the kinds of the notices the engine emits
[notices]
cache_restore = "tests/test_core/test_map.py::test_update_announces_recreated_cache"
content_empty = "tests/test_core/test_authoring.py::test_fresh_wiki_lints_clean"
crlf_notice = "tests/test_core/test_plan.py::test_update_normalizes_crlf_file[page]"
desc_long = "tests/test_core/test_lint.py::test_long_desc_is_note_only"
desc_missing = "tests/test_core/test_lint.py::test_quoted_placeholder_desc_is_soft"
desc_overwrite = "tests/test_core/test_update.py::test_update_announces_desc_overwrite"
exclude_skip = "tests/test_core/test_map.py::test_map_drops_excluded_entries"
frontmatter_malformed = "tests/test_core/test_update.py::test_update_reports_page_with_unclosed_frontmatter"
git_fence_unavailable = "tests/test_core/test_exclude.py::test_unavailable_fence_note_honors_a_discovery_ceiling[root]"
gitignore_skip = "tests/test_core/test_exclude.py::test_gitignored_link_target_names_the_cause"
index_create = "tests/test_core/test_update.py::test_update_announces_created_index"
index_markerless = "tests/test_core/test_map.py::test_markerless_child_index_warns_when_mapping_from_root"
index_truncated = "tests/test_core/test_update.py::test_update_refuses_truncated_index[emptied]"
link_add = "tests/test_core/test_authoring.py::test_authoring_workflow_init_update_lint_read_match"
link_folder_missing = "tests/test_core/test_links.py::test_lint_missing_external_folder_notes_once"
link_prune = "tests/test_core/test_update.py::test_update_broken_links"
link_stale = "tests/test_core/test_lint.py::test_lint_stale_prefix_free_link_names_a_raw_file"
merge_driver_unconfigured = "tests/test_core/test_lint.py::test_lint_notes_unconfigured_merge_driver"
name_skip = "tests/test_core/test_update.py::test_update_skips_invalid_name[page-stem]"
page_adopt = "tests/test_core/test_update.py::test_required_titles_adopts_no_h1_page"
path_untrackable = "tests/test_core/test_exclude.py::test_untrackable_notes_spare_tracked_and_reincluded_paths"
read_skip = "tests/test_core/test_search.py::test_search_notices_unreadable_pages_in_path_order"
restamp = "tests/test_core/test_update.py::test_update_restamps_a_page_edited_since_its_stamp[hand-edit]"
settings_restore = "tests/test_core/test_update.py::test_update_materializes_missing_settings"
symlink_skip = "tests/test_core/test_exclude.py::test_update_symlink_precedence"
write_skip = "tests/test_core/test_plan.py::test_update_preserves_concurrent_edit"

# the kinds of the issues `lint` reports
