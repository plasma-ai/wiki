invalid_page_name = "tests/test_core/test_lint.py::test_lint_flags_invalid_name"
invalid_wiki_name = "tests/test_core/test_lint.py::test_lint_issues_are_typed"
invalid_yaml = "tests/test_core/test_lint.py::test_lint_flags_frontmatter_a_strict_yaml_reader_rejects[c-colon-space-desc]"
link_stale = "tests/test_core/test_lint.py::test_lint_strict_reports_stale_links_as_issues[strict]"
malformed_frontmatter = "tests/test_core/test_lint.py::test_lint_flags_human_only_issues[unclosed_frontmatter-Malformed frontmatter]"
merge_hint = "tests/test_core/test_lint.py::test_lint_flags_leftover_merge_hint[body]"
missing_delimiter = "tests/test_core/test_lint.py::test_lint_flags_what_update_fixes[missing_marker]"
missing_index = "tests/test_core/test_lint.py::test_lint_missing_index"
missing_period = "tests/test_core/test_lint.py::test_lint_flags_human_only_issues[missing_period-Missing period]"
missing_title = "tests/test_core/test_update.py::test_required_titles_seed_lint_and_flip_off"
nested_wiki_root = "tests/test_core/test_lint.py::test_lint_names_nested_wiki_root"
outside_link = "tests/test_core/test_links.py::test_lint_parent_folder_link_follows_the_outside_rule[undeclared-root]"
region_marker = "tests/test_core/test_lint.py::test_region_directive_pairing_errors[dangling-end]"
relative_link = "tests/test_core/test_lint.py::test_lint_relative_root_link_names_the_index_page"
requires_update = "tests/test_core/test_lint.py::test_lint_diff_set_matches_update"
shadowed_page = "tests/test_core/test_lint.py::test_lint_flags_folder_shadowing_page"
symlink_link_target = "tests/test_core/test_update.py::test_update_names_symlinked_link_target[report.md]"
truncated_index = "tests/test_core/test_lint.py::test_lint_truncated_index_is_not_formatter_damage[at-top]"
unparseable_stamp = "tests/test_core/test_lint.py::test_lint_flags_unparseable_stamp[created-page]"
wrapped_marker = "tests/test_core/test_lint.py::test_lint_wrapped_list_marker[prose]"
