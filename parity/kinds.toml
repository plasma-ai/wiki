# The kind list: every notice kind and every issue kind of v1, each with its
# one home. A home is a test of v1 whose replayed call shows the kind, or
# "perturbation" for a kind that an operator of the perturbation names. The
# rules are in SPEC.md, under Replay and under Perturbation.

# the kinds of the notices the engine emits
[notices]
cache_restore = "tests/test_core/test_map.py::test_update_announces_recreated_cache"
content_empty = "tests/test_core/test_authoring.py::test_fresh_wiki_lints_clean"
crlf_notice = "perturbation"
desc_long = "perturbation"
desc_missing = "perturbation"
desc_overwrite = "perturbation"
exclude_skip = "perturbation"
frontmatter_malformed = "tests/test_core/test_update.py::test_update_reports_page_with_unclosed_frontmatter"
git_fence_unavailable = "tests/test_core/test_exclude.py::test_unavailable_fence_note_honors_a_discovery_ceiling[root]"
gitignore_skip = "perturbation"
index_create = "perturbation"
index_markerless = "tests/test_core/test_map.py::test_markerless_child_index_warns_when_mapping_from_root"
index_truncated = "perturbation"
link_add = "perturbation"
link_folder_missing = "tests/test_core/test_links.py::test_lint_missing_external_folder_notes_once"
link_prune = "perturbation"
link_stale = "perturbation"
merge_driver_unconfigured = "tests/test_core/test_lint.py::test_lint_notes_unconfigured_merge_driver"
name_skip = "perturbation"
page_adopt = "perturbation"
path_untrackable = "tests/test_core/test_exclude.py::test_untrackable_notes_spare_tracked_and_reincluded_paths"
read_skip = "tests/test_core/test_search.py::test_search_notices_unreadable_pages_in_path_order"
restamp = "perturbation"
settings_restore = "tests/test_core/test_update.py::test_update_materializes_missing_settings"
symlink_skip = "perturbation"
write_skip = "tests/test_core/test_plan.py::test_update_preserves_concurrent_edit"

# the kinds of the issues `lint` reports
[issues]
absolute_link = "perturbation"
bare_page = "perturbation"
broken_link = "perturbation"
conflict_markers = "perturbation"
directory_link = "perturbation"
escaped_wikilinks = "tests/test_core/test_lint.py::test_lint_flags_human_only_issues[escaped_wikilink-Escaped wikilinks]"
excluded_link_target = "perturbation"
gitignored_link_target = "perturbation"
hyphen_dangle = "tests/test_core/test_lint.py::test_lint_hyphen_dangle[dangle]"
invalid_folder_name = "perturbation"
invalid_page_name = "perturbation"
invalid_wiki_name = "tests/test_core/test_lint.py::test_lint_issues_are_typed"
invalid_yaml = "tests/test_core/test_lint.py::test_lint_flags_frontmatter_a_strict_yaml_reader_rejects[c-colon-space-desc]"
link_stale = "tests/test_core/test_lint.py::test_lint_strict_reports_stale_links_as_issues[strict]"
malformed_frontmatter = "tests/test_core/test_lint.py::test_lint_flags_human_only_issues[unclosed_frontmatter-Malformed frontmatter]"
merge_hint = "tests/test_core/test_lint.py::test_lint_flags_leftover_merge_hint[body]"
missing_delimiter = "tests/test_core/test_lint.py::test_lint_flags_what_update_fixes[missing_marker]"
missing_index = "perturbation"
missing_period = "tests/test_core/test_lint.py::test_lint_flags_human_only_issues[missing_period-Missing period]"
missing_title = "tests/test_core/test_update.py::test_required_titles_seed_lint_and_flip_off"
nested_wiki_root = "tests/test_core/test_lint.py::test_lint_names_nested_wiki_root"
outside_link = "perturbation"
region_marker = "perturbation"
relative_link = "tests/test_core/test_lint.py::test_lint_relative_root_link_names_the_index_page"
requires_update = "perturbation"
shadowed_page = "tests/test_core/test_lint.py::test_lint_flags_folder_shadowing_page"
symlink_link_target = "perturbation"
truncated_index = "perturbation"
unparseable_stamp = "tests/test_core/test_lint.py::test_lint_flags_unparseable_stamp[created-page]"
wrapped_marker = "tests/test_core/test_lint.py::test_lint_wrapped_list_marker[prose]"
