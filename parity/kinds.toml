bare_page = "tests/test_core/test_lint.py::test_lint_names_bare_page"
broken_link = "tests/test_core/test_lint.py::test_index_broken_link_is_issue_but_body_link_is_note"
conflict_markers = "tests/test_core/test_lint.py::test_lint_conflict_markers_suppress_diff"
directory_link = "tests/test_core/test_lint.py::test_lint_directory_link_is_issue_naming_index_form[bare-index]"
escaped_wikilinks = "tests/test_core/test_lint.py::test_lint_flags_human_only_issues[escaped_wikilink-Escaped wikilinks]"
excluded_link_target = "tests/test_core/test_lint.py::test_lint_names_excluded_link_target"
gitignored_link_target = "tests/test_core/test_exclude.py::test_gitignored_link_target_names_the_cause"
hyphen_dangle = "tests/test_core/test_lint.py::test_lint_hyphen_dangle[dangle]"
