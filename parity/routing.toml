    "tests/test_cli/test_wiki_commands.py::test_wiki_freeze_time_fixes_every_stamp[fraction]",
]
to = "dropped"
cite = "D3"
reason = "The wiki's timestamp.format holds %f, which is outside the supported set. v1 renders it, and a second engine refuses the settings file."

