# a test puts a hook file in the wiki, or runs `wiki trust`
[[route]]
tests = [
    "tests/test_cli/test_wiki_commands.py::test_lint_error_keeps_the_notes_before_it",
    "tests/test_cli/test_wiki_commands.py::test_match_resolution_failure_exits_two",
    "tests/test_cli/test_wiki_commands.py::test_merge_orders_rows_by_the_wikis_hook[hook-exits]",
    "tests/test_cli/test_wiki_commands.py::test_merge_orders_rows_by_the_wikis_hook[import-fails]",
    "tests/test_cli/test_wiki_commands.py::test_merge_orders_rows_by_the_wikis_hook[merge-raises]",
    "tests/test_cli/test_wiki_commands.py::test_merge_orders_rows_by_the_wikis_hook[sort-raises]",
    "tests/test_cli/test_wiki_commands.py::test_merge_orders_rows_by_the_wikis_hook[trusted]",
    "tests/test_cli/test_wiki_commands.py::test_merge_settles_the_stamps_of_a_managed_page[hook-exits]",
    "tests/test_cli/test_wiki_commands.py::test_merge_settles_the_stamps_of_a_managed_page[untrusted-hook]",
    "tests/test_cli/test_wiki_commands.py::test_trust_gates_hook_execution",
    "tests/test_cli/test_wiki_commands.py::test_trust_refuses_non_wiki_path",
    "tests/test_cli/test_wiki_commands.py::test_trust_store_does_not_mark_home_as_wiki_root",
    "tests/test_cli/test_wiki_commands.py::test_trust_store_exemption_survives_symlinked_home",
    "tests/test_cli/test_wiki_commands.py::test_untrusted_hook_refusal_exits_two",
    "tests/test_cli/test_wiki_commands.py::test_wiki_freeze_time_stamps_the_trust_record",
]
to = "dropped"
cite = "D6"
reason = "The test's wiki holds a hook file, or the test runs `wiki trust`. A second engine refuses the wiki, merges it without the hook, and has no such command. Under v1 a command that imports the hook leaves a bytecode file beside it, named for the interpreter, and a read-only command leaves it outside the caches."

# a test's error text turns on the process that prints it
[[route]]
tests = [
    "tests/test_core/test_wiki.py::test_settings_reject_malformed_values[nested-past-recursion-limit]",
]
to = "dropped"
cite = "D1"
reason = "The test's settings file is nested past the interpreter's recursion limit. The text behind `Malformed JSON in .wiki/settings.json: ` is the JSON reader's, and under Python 3.14 it states how much of the stack the process had used. Where the test's process and a command differ in that, no command prints the call's text."

# a test's command copies files over the copies it made before
[[route]]
tests = [
    "tests/test_cli/test_wiki_commands.py::test_install_copies_skill_into_home",
]
to = "dropped"
cite = "D10"
reason = "The test runs `install` over the copy an earlier `install` left. v1 removes the folder and copies it again with the source's modification times. Where the file system hands a freed inode number out again, a copied file may get its old number back and read as untouched, so the touched sets of two runs of v1 differ. D10 gives `install` a comparison of its own, by the list of paths written."
