allow-dbg-in-tests = true
allow-print-in-tests = true
allow-unwrap-in-tests = true
avoid-breaking-exported-api = false
disallowed-methods = [
    { path = "std::env::var", reason = "read the environment once, in the configuration module" },
    { path = "std::env::var_os", reason = "read the environment once, in the configuration module" },
    { path = "std::io::stderr", reason = "write through the output type" },
    { path = "std::io::stdout", reason = "write through the output type" },
    { path = "std::process::exit", reason = "return ExitCode from main so destructors run" },
    { path = "str::trim", reason = "Python strips another set of characters: use wiki-pytext" },
    { path = "str::trim_start", reason = "Python strips another set of characters: use wiki-pytext" },
    { path = "str::trim_end", reason = "Python strips another set of characters: use wiki-pytext" },
    { path = "str::trim_left", reason = "Python strips another set of characters: use wiki-pytext" },
    { path = "str::trim_right", reason = "Python strips another set of characters: use wiki-pytext" },
    { path = "str::trim_ascii", reason = "Python strips another set of characters: use wiki-pytext" },
    { path = "str::trim_ascii_start", reason = "Python strips another set of characters: use wiki-pytext" },
    { path = "str::trim_ascii_end", reason = "Python strips another set of characters: use wiki-pytext" },
    { path = "slice::trim_ascii", reason = "Python strips another set of characters: use wiki-pytext" },
